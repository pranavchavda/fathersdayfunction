query CartLinesDiscountsGenerateRun {
  cart {
    lines {
      id
      quantity
      cost {
        totalAmount {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            discountPercentage: metafield(
              namespace: "custom"
              key: "discount_percentage"
            ) {
              value
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "discount_code", key: "function_configuration") {
      value
    }
  }
}
