query CartLinesDiscountsGenerateRun(
  $excludedTags: [String!]
  $fullExclusions: [String!]
) {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
        subtotalAmount {
          amount
          currencyCode
        }
        totalAmount {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            handle
            isGiftCard
            hasExcludedTag: hasAnyTag(tags: $excludedTags)
            hasFullyExcludedTag: hasAnyTag(tags: $fullExclusions)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "product-discount", key: "function-configuration") {
      value
    }
  }
}
