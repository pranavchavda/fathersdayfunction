query CartLinesDiscountsGenerateRun($eligibleCollectionIds: [ID!]!) {
  cart {
    lines {
      id
      quantity
      cost {
        totalAmount {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inAnyCollection(ids: $eligibleCollectionIds)
          }
        }
      }
    }
    cost {
      totalAmount {
        amount
        currencyCode
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "discount_code", key: "function_configuration") {
      value
    }
  }
}
