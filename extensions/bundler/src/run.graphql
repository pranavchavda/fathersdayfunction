query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            title
            bundleProductIds: metafield(
              namespace: "custom"
              key: "bundle_product_ids"
            ) {
              value
            }
            bundleProductQuantities: metafield(
              namespace: "custom"
              key: "bundle_product_quantities"
            ) {
              value
            }
          }
        }
      }
    }
  }
}
