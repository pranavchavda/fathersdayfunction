query CartTransformRun {
  localization {
    country {
      isoCode
    }
  }
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      bundleChoice: attribute(key: "_bundle_choice") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            title
            bundleProductIds: metafield(
              namespace: "custom"
              key: "bundle_product_ids"
            ) {
              value
            }
            bundleProductQuantities: metafield(
              namespace: "custom"
              key: "bundle_product_quantities"
            ) {
              value
            }
            bundleChoiceIds: metafield(
              namespace: "custom"
              key: "bundle_choice_ids"
            ) {
              value
            }
            bundleProductIdsUs: metafield(
              namespace: "custom"
              key: "bundle_product_ids_us"
            ) {
              value
            }
            bundleProductQuantitiesUs: metafield(
              namespace: "custom"
              key: "bundle_product_quantities_us"
            ) {
              value
            }
            bundleChoiceIdsUs: metafield(
              namespace: "custom"
              key: "bundle_choice_ids_us"
            ) {
              value
            }
          }
        }
      }
    }
  }
}
